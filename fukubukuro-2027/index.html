<style>
:root{
  --bg:#fbf6ef; --card:#ffffff; --ink:#2b2420; --sub:#7a6d63; --line:#eadfd3;
  --red:#c8322f; --red-soft:#fde8e6; --gold:#b8862b; --gold-soft:#fbf1dc;
  --green:#2f7d4f; --green-soft:#e3f3e8; --blue:#2c5d9b; --blue-soft:#e4edf8;
  --gray-soft:#f1ece6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
header{background:var(--red);color:#fff;padding:18px 16px 14px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.home{position:absolute;top:12px;right:12px;z-index:2;color:#fff;font-size:12px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px}
h1{margin:0;padding-right:96px;font-size:19px;font-weight:800;letter-spacing:.02em}
.today{margin-top:4px;font-size:13px;opacity:.9}
.summary{display:flex;gap:8px;margin-top:12px}
.summary div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 6px;text-align:center}
.summary b{display:block;font-size:20px;font-weight:800}
.summary span{font-size:11px;opacity:.95}
.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
.sec{font-size:13px;font-weight:800;color:var(--sub);margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:4px}
.card{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(80,50,20,.05);overflow:hidden}
.top{display:flex;gap:10px;padding:13px 13px 10px;align-items:flex-start;cursor:pointer}
.icon{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.meta{flex:1;min-width:0}
.brand{font-size:12px;color:var(--sub);font-weight:700}
.name{font-size:16px;font-weight:800;line-height:1.35;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--gray-soft);color:var(--sub)}
.tag.lot{background:var(--blue-soft);color:var(--blue)}
.tag.first{background:var(--gold-soft);color:var(--gold)}
.tag.price{background:var(--red-soft);color:var(--red)}
.star{flex:none;border:none;background:none;font-size:22px;line-height:1;padding:2px;cursor:pointer;color:#d8cbbd}
.star.on{color:#e8a317}
.status{margin:0 13px;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.status .big{font-size:15px;font-weight:800;white-space:nowrap}
.s-open{background:var(--green-soft);color:var(--green)}
.s-soon{background:var(--gold-soft);color:var(--gold)}
.s-tba{background:var(--gray-soft);color:var(--sub)}
.s-done{background:var(--gray-soft);color:#9c9088}
.periods{padding:10px 13px 4px}
.p{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.p:last-child{border-bottom:none}
.p .l{flex:none;width:7.2em;color:var(--sub);font-weight:700}
.p .v{flex:1}
.p.now .l{color:var(--green)}
.p.now .v{font-weight:700}
.p.past .v,.p.past .l{color:#b0a59c;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.2)}
.more{border:none;background:none;width:100%;text-align:left;padding:8px 13px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--red);cursor:pointer}
.body{display:none;padding:0 13px 14px}
.card.open .body{display:block}
.body h4{margin:6px 0 4px;font-size:13px}
.body ul{margin:0 0 8px;padding-left:1.2em;font-size:13.5px}
.body li{margin:2px 0}
.note{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px}
.src{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--blue);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:30px 0}
footer{font-size:11.5px;color:var(--sub);text-align:center;padding:0 16px 30px;line-height:1.7}
</style>

const wd = ["日","月","火","水","木","金","土"];
const fmt = d => `${d.getMonth()+1}/${d.getDate()}(${wd[d.getDay()]})`;
const fmtT = d => { const h=d.getHours(), m=d.getMinutes(); return (h===0&&m===0)||(h===23&&m===59) ? "" : ` ${h}:${String(m).padStart(2,"0")}`; };
const dayDiff = d => { const a=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); const b=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return Math.round((b-a)/86400000); };

function statusOf(x){
  if(x.tba) return {k:"tba", label:"まだ未発表", big:x.expect};
  const mains = x.periods.filter(p=>p.main);
  const open = mains.filter(p=>D(p.s)<=NOW && NOW<=D(p.e)).sort((a,b)=>D(a.e)-D(b.e))[0];
  if(open){ const n=dayDiff(D(open.e)); return {k:"open", label:`${open.l} 受付中`, big: n<=0?"今日まで！":`あと${n}日`, sort:D(open.e)}; }
  const fut = mains.filter(p=>D(p.s)>NOW).sort((a,b)=>D(a.s)-D(b.s))[0];
  if(fut){ const n=dayDiff(D(fut.s)); return {k:"soon", label:`${fut.l} ${fmt(D(fut.s))}${fmtT(D(fut.s))}から`, big: n<=0?"今日から":`あと${n}日`, sort:D(fut.s)}; }
  return {k:"done", label:"予約・受付は終了", big:""};
}

function render(){
  document.getElementById("today").textContent = `今日は ${NOW.getFullYear()}年${fmt(NOW)}　タップで中身が見られます`;
  const rows = DATA.map(x=>({x, st:statusOf(x)}));
  document.getElementById("nOpen").textContent = rows.filter(r=>r.st.k==="open").length;
  document.getElementById("nSoon").textContent = rows.filter(r=>r.st.k==="soon").length;
  document.getElementById("nTba").textContent = rows.filter(r=>r.st.k==="tba").length;

  document.getElementById("chips").innerHTML = CATS.map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("");

  let list = rows.filter(({x,st})=>{
    if(filter==="all") return true;
    if(filter==="star") return stars[x.id];
    if(["open","soon","tba"].includes(filter)) return st.k===filter;
    return x.cat===filter;
  });
  const groups = [["open","🟢 いま受付中（締切が近い順）"],["soon","🟡 もうすぐ始まる"],["tba","⚪ まだ未発表（去年の日程を参考に）"],["done","予約は終わったもの"]];
  let html = "";
  for(const [k,title] of groups){
    const g = list.filter(r=>r.st.k===k).sort((a,b)=>(a.st.sort||0)-(b.st.sort||0));
    if(!g.length) continue;
    html += `<div class="sec">${title}</div>` + g.map(card).join("");
  }
  document.getElementById("list").innerHTML = html || `<div class="empty">該当する福袋はありません</div>`;
}

function card({x,st}){
  const cls = {open:"s-open",soon:"s-soon",tba:"s-tba",done:"s-done"}[st.k];
  const per = x.periods.map(p=>{
    let v, c="";
    if(p.text && !p.s){ v=p.text; }
    else{
      const s=D(p.s), e=D(p.e);
      v = p.text || (s.toDateString()===e.toDateString() ? `${fmt(s)}${fmtT(s)}〜${fmtT(e).trim()}` : `${fmt(s)}${fmtT(s)} 〜 ${fmt(e)}${fmtT(e)}`);
      if(s<=NOW && NOW<=e) c="now"; else if(e<NOW) c="past";
    }
    return `<div class="p ${c}"><div class="l">${p.l}</div><div class="v">${v}</div></div>`;
  }).join("");
  const mtag = x.method==="lot" ? "lot" : "first";
  return `<article class="card" id="c-${x.id}">
    <div class="top" data-toggle="${x.id}">
      <div class="icon" style="background:${x.bg}">${x.icon}</div>
      <div class="meta">
        <div class="brand">${x.brand}</div>
        <div class="name">${x.name}</div>
        <div class="tags"><span class="tag price">${x.price}</span><span class="tag ${mtag}">${x.methodLabel}</span></div>
      </div>
      <button class="star ${stars[x.id]?"on":""}" data-star="${x.id}" aria-label="気になる">★</button>
    </div>
    <div class="status ${cls}"><span>${st.label}</span><span class="big">${st.big||""}</span></div>
    <div class="periods">${per}</div>
    <button class="more" data-toggle="${x.id}">▼ ${x.tba?"去年の中身":"中身"}を見る</button>
    <div class="body">
      <h4>${x.tba?"去年の中身":"中身"}</h4>
      <ul>${x.items.map(i=>`<li>${i}</li>`).join("")}</ul>
      <div class="note">💡 ${x.note}</div>
      <a class="src" href="${x.src}" target="_blank" rel="noopener">くわしい記事を見る ↗</a>
    </div>
  </article>`;
}

document.addEventListener("click", e=>{
  const f = e.target.closest("[data-f]");
  if(f){ filter=f.dataset.f; render(); window.scrollTo({top:document.getElementById("chips").offsetTop}); return; }
  const s = e.target.closest("[data-star]");
  if(s){ e.stopPropagation(); const id=s.dataset.star; stars[id]=!stars[id]; if(!stars[id]) delete stars[id]; saveStars(); render(); return; }
  const t = e.target.closest("[data-toggle]");
  if(t){ const c=document.getElementById("c-"+t.dataset.toggle); c.classList.toggle("open");
    const b=c.querySelector(".more"); b.textContent = (c.classList.contains("open")?"▲ 閉じる":`▼ ${b.textContent.includes("去年")||c.querySelector("h4").textContent.includes("去年")?"去年の中身":"中身"}を見る`); }
});
render();
</script>
</body>
</html>
