<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rockpoppo Lab ｜ Claudeでつくったアプリ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rockpoppo Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f1e7">

<meta name="description" content="プログラミングが本業ではない会社員が、Claude Opusにお願いして作ったWebアプリを並べています。">
<meta property="og:title" content="Rockpoppo Lab ｜ Claudeでつくったアプリ">
<meta property="og:description" content="Claude Opusにお願いして作ったWebアプリを、ここで毎日ふやしていきます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2b2622; --mute:#7a7066; --line:#e4dccd;
  --accent:#d0603a; --accent-soft:#f6e1d6;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.7;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0))}
.wrap{max-width:720px;margin:0 auto;padding:28px 0 56px}
header{margin-bottom:24px}
.lab{font-family:var(--round);font-size:13px;letter-spacing:.14em;color:var(--accent)}
h1{font-family:var(--round);font-size:28px;line-height:1.3;margin:4px 0 10px}
.intro{margin:0;color:var(--mute);font-size:14px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:13px}
.count{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-weight:700}
.meta a{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:16px;list-style:none;margin:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thumb{display:block;aspect-ratio:16/10;background:#ddd center top/cover no-repeat;border-bottom:1px solid var(--line)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.title{font-family:var(--round);font-size:20px;margin:0}
.date{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.ask{margin:0;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px}
.ask::before{content:"お願いした一言";display:block;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.point{margin:0;font-size:14px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--mute)}
.open{align-self:stretch;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:10px;margin-top:4px}
.open:focus-visible,.thumb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
footer{margin-top:36px;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lab">ROCKPOPPO LAB</div>
    <h1>Claudeでつくったアプリ</h1>
    <p class="intro">プログラミングが本業ではない会社員です。Claude Opusにお願いして作ったWebアプリを、ここに並べていきます。どれもスマホでそのまま触れます。</p>
    <div class="meta">
      <span class="count" id="count"></span>
      <a href="https://x.com/rockpoppocom" rel="noopener">X @rockpoppocom</a>
    </div>
  </header>

  <ul class="list" id="list"></ul>

  <footer>© Rockpoppo Lab ／ Made with Claude</footer>
</div>

<script src="apps.js"></script>
<script>
(function(){
  const apps=(window.APPS||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById("count").textContent=`${apps.length}作品`;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt=d=>{const [y,m,day]=d.split("-");return `${y}.${+m}.${+day}`};
  document.getElementById("list").innerHTML=apps.map(a=>`
    <li class="card">
      <a class="thumb" href="${esc(a.path)}/" style="background-image:url('${esc(a.path)}/thumb.png')" aria-label="${esc(a.title)}を開く"></a>
      <div class="body">
        <div class="top"><h2 class="title">${esc(a.title)}</h2><span class="date">${fmt(a.date)}</span></div>
        <p class="ask">${esc(a.ask)}</p>
        <p class="point">${esc(a.point)}</p>
        <div class="tags">${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <a class="open" href="${esc(a.path)}/">触ってみる</a>
      </div>
    </li>`).join("");
})();
</script>
</body>
</html>
