<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rockpoppo Lab ｜ Claudeでつくったアプリ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rockpoppo Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f1e7">

<meta name="description" content="プログラミングが本業ではない会社員が、Claude Opusにお願いして作ったWebアプリを並べています。">
<meta property="og:title" content="Rockpoppo Lab ｜ Claudeでつくったアプリ">
<meta property="og:description" content="Claude Opusにお願いして作ったWebアプリを、ここで毎日ふやしていきます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rockpoppo.github.io/rockpoppo-apps/">
<meta property="og:image" content="https://rockpoppo.github.io/rockpoppo-apps/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2b2622; --mute:#7a7066; --line:#e4dccd;
  --accent:#d0603a; --accent-soft:#f6e1d6;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
#filter-top{scroll-margin-top:0}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.7;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:960px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0)) 56px}
a{color:inherit}

/* ヒーロー */
.hero{padding:32px 0 20px}
.lab{font-family:var(--round);font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}
h1{font-family:var(--round);font-weight:700;font-size:clamp(30px,8.4vw,46px);line-height:1.25;margin:8px 0 14px;letter-spacing:.01em}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,#f7c9b4 62%)}
.intro{margin:0;color:var(--mute);font-size:14px;max-width:34em}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:13px}
.pill{border-radius:999px;padding:3px 12px;font-weight:700;text-decoration:none}
.pill.count{background:var(--accent);color:#fff}
.pill.soft{background:var(--card);border:1px solid var(--line)}

/* アイコンの棚 */
.shelf-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.shelf-h h2{font-family:var(--round);font-size:15px;margin:0}
.shelf-h span{font-size:12px;color:var(--mute)}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px;list-style:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf li{flex:0 0 68px;scroll-snap-align:start}
.shelf a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none}
.shelf img{width:60px;height:60px;border-radius:14px;box-shadow:0 1px 0 var(--line),0 3px 8px rgba(60,40,20,.12);background:#fff}
.shelf span{font-size:10.5px;line-height:1.3;text-align:center;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* しぼりこみ */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:6px -16px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-weight:500;opacity:.6;margin-left:3px}

/* カード */
.list{display:grid;gap:18px;list-style:none;margin:0;padding:0}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.card[hidden]{display:none}
.stage{position:relative;background:var(--tint);padding:20px 18px 0;display:grid;grid-template-columns:1fr 40%;gap:12px;align-items:end;min-height:230px}
.copy{align-self:center;min-width:0;font-family:var(--round);font-weight:700;font-size:clamp(20px,5.4vw,25px);line-height:1.45;margin:0 0 20px}
.copy span{display:block;white-space:nowrap}
.badge{position:absolute;top:14px;left:18px;font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--ink);color:#fff;border-radius:999px;padding:1px 10px}
.phone{display:block;justify-self:end;width:100%;max-width:150px;aspect-ratio:780/1180;border:5px solid #2b2622;border-bottom:0;border-radius:22px 22px 0 0;background:#fff;overflow:hidden;box-shadow:0 -2px 18px rgba(60,40,20,.14)}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.head{display:flex;gap:10px;align-items:center}
.head img{width:38px;height:38px;border-radius:9px;flex:0 0 auto}
.head h2{font-family:var(--round);font-size:18px;line-height:1.35;margin:0}
.head .date{display:block;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.ask{margin:0;position:relative;background:var(--paper);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:13.5px}
.ask b{display:block;font-size:11px;color:var(--accent);letter-spacing:.06em}
.point{margin:0;font-size:13.5px;color:var(--mute)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .clamp{display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--mute)}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.go{flex:1;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:11px}
.more{font:inherit;font-size:13px;font-weight:700;background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:0 14px;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:30px 0}

.next{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--line);padding:10px 18px;font-size:12.5px;color:var(--mute)}
.next a{text-decoration:none;font-weight:700;color:var(--ink)}

footer{margin-top:40px;font-size:12px;color:var(--mute);text-align:center}
footer a{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="lab">ROCKPOPPO LAB</div>
    <h1>毎日ひとつ、<br><em>Claudeにお願い</em>して<br>アプリをつくる。</h1>
    <p class="intro">本業はプログラミングと関係ない会社員です。Claude Opusにお願いして作ったWebアプリを、ここに並べています。どれもスマホでそのまま触れます。</p>
    <div class="meta">
      <span class="pill count" id="count"></span>
      <span class="pill soft" id="latest"></span>
      <a class="pill soft" href="https://x.com/rockpoppocom" rel="noopener">X @rockpoppocom</a>
    </div>
  </header>

  <div class="shelf-h"><h2>アプリ一覧</h2><span>横にスクロール →</span></div>
  <ul class="shelf" id="shelf"></ul>

  <div id="filter-top"></div>
  <div class="bar"><div class="chips" id="chips" role="group" aria-label="ジャンルでしぼりこむ"></div></div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>このジャンルのアプリはまだありません。</p>

  <footer>© Rockpoppo Lab ／ Made with Claude ／ <a href="#">いちばん上へ</a></footer>
</div>

<script src="apps.js"></script>
<script>
(function(){
  const apps=(window.APPS||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=d=>{const [y,m,day]=d.split("-");return `${y}.${+m}.${+day}`};
  const tints=["#fbe3d6","#e3eedc","#dde8f3","#f6ecc8","#ece0f0","#d9efec"];
  const newest=apps[0]?.date;

  document.getElementById("count").textContent=`${apps.length}作品`;
  if(newest){const [,m,d]=newest.split("-");document.getElementById("latest").textContent=`最新 ${+m}/${+d}`;}

  // アイコンの棚
  document.getElementById("shelf").innerHTML=apps.map(a=>`
    <li><a href="#app-${esc(a.path)}"><img src="${esc(a.path)}/icon-180.png" alt="" loading="lazy"><span>${esc(a.title)}</span></a></li>`).join("");

  // カード
  const asks=a=>String(a.ask||"").split("／").map(s=>s.trim()).filter(Boolean);
  document.getElementById("list").innerHTML=apps.map((a,i)=>{
    const q=asks(a);
    const next=apps[i+1];
    return `
    <li class="card" id="app-${esc(a.path)}" data-tags="${esc((a.tags||[]).join(","))}" style="--tint:${tints[i%tints.length]}">
      <div class="stage">
        ${a.date===newest?'<span class="badge">NEW</span>':''}
        <p class="copy">${String(a.copy||a.title).split(/(?<=、)/).map(t=>`<span>${esc(t)}</span>`).join("")}</p>
        <a class="phone" href="${esc(a.path)}/" aria-label="${esc(a.title)}を開く"><img src="${esc(a.path)}/thumb.png" alt="" loading="lazy" decoding="async"></a>
      </div>
      <div class="body">
        <div class="head">
          <img src="${esc(a.path)}/icon-180.png" alt="" loading="lazy">
          <div><h2>${esc(a.title)}</h2><span class="date">${fmt(a.date)} 公開</span></div>
        </div>
        <p class="ask"><b>Claudeにお願いしたこと${q.length>1?`（${q.length}回）`:""}</b><span class="clamp">${q.map(esc).join("<br>")}</span></p>
        <p class="point clamp">${esc(a.point)}</p>
        <div class="tags">${(a.tags||[]).filter(t=>t!=="AIなし").map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="actions">
          <a class="go" href="${esc(a.path)}/">触ってみる</a>
          <button class="more" type="button" aria-expanded="false">くわしく</button>
        </div>
      </div>
      ${next?`<div class="next"><span>${String(i+1).padStart(2,"0")} / ${String(apps.length).padStart(2,"0")}</span><a href="#app-${esc(next.path)}">次は ${esc(next.title)} ↓</a></div>`:`<div class="next"><span>${String(i+1).padStart(2,"0")} / ${String(apps.length).padStart(2,"0")}</span><a href="#">最初にもどる ↑</a></div>`}
    </li>`}).join("");

  document.getElementById("list").addEventListener("click",e=>{
    const b=e.target.closest(".more"); if(!b) return;
    const card=b.closest(".card"); const open=card.classList.toggle("open");
    b.setAttribute("aria-expanded",open); b.textContent=open?"とじる":"くわしく";
  });

  // キャッチコピーが枠からはみ出さないよう、文字の大きさを合わせる
  const fit=()=>document.querySelectorAll(".copy").forEach(c=>{
    c.style.fontSize="";
    let size=parseFloat(getComputedStyle(c).fontSize);
    while(size>13&&[...c.children].some(sp=>sp.scrollWidth>c.clientWidth+1)){size-=1;c.style.fontSize=size+"px";}
  });
  fit(); addEventListener("resize",fit);
  document.fonts&&document.fonts.ready.then(fit);

  // ジャンルでしぼりこみ（2作品以上あるタグだけ）
  const counts={};
  apps.forEach(a=>(a.tags||[]).forEach(t=>{if(t!=="AIなし")counts[t]=(counts[t]||0)+1}));
  const tags=Object.keys(counts).filter(t=>counts[t]>=2).sort((a,b)=>counts[b]-counts[a]);
  const chips=document.getElementById("chips");
  chips.innerHTML=[`<button class="chip" type="button" data-t="" aria-pressed="true">すべて<small>${apps.length}</small></button>`]
    .concat(tags.map(t=>`<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="false">${esc(t)}<small>${counts[t]}</small></button>`)).join("");
  chips.addEventListener("click",e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
    const t=c.dataset.t; let shown=0;
    document.querySelectorAll(".card").forEach(card=>{
      const ok=!t||card.dataset.tags.split(",").includes(t);
      card.hidden=!ok; if(ok) shown++;
      card.querySelector(".next").style.display=t?"none":"";
    });
    document.getElementById("empty").hidden=shown>0;
    const top=document.getElementById("list").getBoundingClientRect().top;
    if(top<0) document.getElementById("filter-top").scrollIntoView({block:"start"});
  });
})();
</script>
</body>
</html>
